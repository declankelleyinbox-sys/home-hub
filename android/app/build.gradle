plugins {
    id 'com.android.application'
}

android {
    namespace 'com.declan.homehub'
    compileSdk 34

    defaultConfig {
        applicationId "com.declan.homehub"
        minSdk 22          // Fire OS 5 and newer
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // personal sideloaded app
        }
    }
}
